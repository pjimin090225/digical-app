      return (colors || []).map((c) => '<span class="sw" style="background:' + esc(c) + '"></span>').join("");
    }
    function senseLine(s) {
      if (!s) return "-";
      return esc(s.emotion) + " · 세기 " + esc(s.intensity) + " · " + esc(s.tempo) + " · 소리 " + esc(s.pitch) +
        " · 진동 " + esc(s.texture) + " " + swatch(s.colors) + (s.why ? "<br>&nbsp;&nbsp;&nbsp;근거: " + esc(s.why) : "");
    }
    function syncText() {
      if (!syncLog.length) return "아직 측정 안 됨";
      const m = syncLog.reduce((a, b) => a + b, 0) / syncLog.length;
      return "평균 " + m.toFixed(2) + "ms · 최대 " + Math.max(...syncLog).toFixed(2) + "ms (" + syncLog.length + "박자, 목표 35ms 이내)";
    }
    function devInfoHTML(r) {
      const c = r.check || {}, st = c.stats || {};
      const d = lastData || {};
      const kb = d.images ? Math.round(d.images.reduce((a, s) => a + s.length * 0.75, 0) / 1024) : 0;
      return "가져온 곳: " + esc(d.source || "-") + (d.type === "video" ? " · " + d.dur.toFixed(0) + "초 · 장면 사진 " + d.images.length + "장" : "") +
        " · 보낸 크기 약 " + kb + "KB<br>" +
        (d.type === "video" ? '<div class="thumbs">' + d.images.map((s) => '<img alt="" src="' + s + '">').join("") + "</div>" +
          "<b>들은 소리</b><br>" + summaryText(d.audio).replace(/\n/g, "<br>") + "<br>" : "") +
        "<br><b>🤖 AI</b> 모델 " + esc(r.model) + " · 종류 " + esc(r.kind) + (r.is_artwork ? " (작품)" : " (작품 아님)") +
        (r.title_guess ? " · 작품 추측: " + esc(r.title_guess) : "") + (r.target ? " · 고른 대상: " + esc(r.target) : "") + "<br>" +
        "걸린 시간: 폰 기준 " + ((r.clientMs || r.ms.total) / 1000).toFixed(1) + "초 (해설 " + (r.ms.text / 1000).toFixed(1) +
        "초 + 감각 " + (r.ms.sense / 1000).toFixed(1) + "초)<br>" +
        "쉬운 말 규칙: " + (c.passed ? "통과 ✅" : "위반 " + (c.violations || []).length + "개 ⚠️") + " (쓴 횟수 " + c.tries + "번) · " +
        "문장 " + st.sentences + "개 · 평균 " + st.avgWords + "어절 · 최장 " + st.maxWords + "어절<br>" +
        ((c.violations || []).length ? "<span class='note'>" + c.violations.map(esc).join("<br>") + "</span><br>" : "") +
        "감각표 검사: " + (c.sensePassed ? "통과 ✅" : "⚠️ " + (c.senseProblems || []).map(esc).join(", ")) + " (만든 횟수 " + c.senseTries + "번)<br>" +
        "<b>전체 감각</b>: " + senseLine(r.whole) + "<br>" +
        "<b>장면</b><br>" + (r.scenes || []).map((s, i) => (i + 1) + ". " + esc(s.name) + " → " + senseLine(s.sense) +
          (s.box ? "<br>&nbsp;&nbsp;&nbsp;위치 " + esc(JSON.stringify(s.box)) : "")).join("<br>") +
        "<br><br><b>⏱ 감각 동시 출력 (공통 박자 시계)</b><br>한 박자 안에서 시각→청각→촉각 명령까지: <span id='syncNow'>" + syncText() + "</span>";
    }
    $("devBox").addEventListener("toggle", () => { const s = $("syncNow"); if (s) s.textContent = syncText(); });

    // ----- 🗣 GPT 음성 (항상 나오지 않음: '자동으로 읽기'가 켜진 사람만 자동, 나머지는 버튼) -----
    let voiceSrc = null;
    const ttsCache = new Map();          // 같은 글·같은 목소리는 다시 만들지 않음 (비용·시간 절약)
    function stopVoice() {
      if (voiceSrc) { try { voiceSrc.stop(); } catch (e) {} voiceSrc = null; }
      if ("speechSynthesis" in window) speechSynthesis.cancel();
    }
    function speakIfAuto(text, emotion) {
      if (profile.sound.on && soundUsable() && profile.voice.auto) speakAI(text, emotion, "voiceInfo");
    }
    async function speakAI(text, emotion, infoId) {
      const info = infoId ? $(infoId) : null;
      if (!(profile.sound.on && soundUsable())) { if (info) info.textContent = "🔇 소리가 꺼져 있어 읽지 않아요"; return; }
      stopVoice();
      if (info) info.textContent = "🗣 목소리를 준비하고 있어요…";
      const voice = profile.voice.name || "coral";
      const key = voice + "|" + profile.voice.speed + "|" + text;
      try {
        let buf = ttsCache.get(key);
        if (!buf) {
          const r = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text, emotion: emotion || "평온", speed: SPEED[profile.voice.speed], voice: voice })
          });
          if (!r.ok) throw new Error("tts");
          buf = await r.arrayBuffer();
          ttsCache.set(key, buf);
        }
        const ctx = getAudio();
        const audio = await ctx.decodeAudioData(buf.slice(0));
        const src = ctx.createBufferSource();
        src.buffer = audio;
        src.connect(ctx.destination);
        src.onended = () => { if (voiceSrc === src) voiceSrc = null; };
        voiceSrc = src;
        src.start();
        if (info) info.textContent = "🗣 AI 음성이에요";
      } catch (e) {
        if ("speechSynthesis" in window) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "ko-KR";
          u.rate = SPEED[profile.voice.speed];
          speechSynthesis.speak(u);
          if (info) info.textContent = "🗣 AI 음성을 못 불러와서 기본 목소리로 읽었어요";
        }
      }
    }

    // ----- 🎵 소리 모드: 들은 소리의 분위기를 AI에게 묻기 -----
    // (지금은 숫자 정보만 보냄 → 다음다음 단계에서 '실제 소리'를 보내도록 바꿀 예정)
    async function askSoundAI() {
      const box = $("soundAI");
      const stop = waitStages(box);
      try {
        const r = await askAI({ type: "sound", images: [], audio: lastSound, explain: profile.explain });
        stop();
        box.innerHTML = '<div class="ai-tag">🤖 소리 숫자로만 추측했어요 (실제 소리 분석은 준비 중)</div>' +
          '<p class="ai-sum">' + esc(r.interpretation || r.summary) + "</p>" +
          '<button class="big ghost" id="btnListenSound">🔊 해설 듣기</button><div class="result" id="voiceInfo2"></div>';
        $("btnListenSound").onclick = () => speakAI(r.interpretation || r.summary, r.whole && r.whole.emotion, "voiceInfo2");
      } catch (e) {
        stop();
        box.innerHTML = "<p><b>⚠️ " + esc(ERR_TEXT[e.error] || ERR_TEXT.ai_error) + "</b></p>";
      }
    }

    $("btnViewHome").onclick = () => { renderHome(); go("home"); };
    $("btnViewRetake").onclick = () => go("camera");

    // ==========================================================
    // 12) 첫 화면
    // ==========================================================
    function renderHome() {
      const body = $("homeBody");
      if (!profile) {
        body.innerHTML =
          '<div class="card"><b>처음이시네요!</b><br>소리·진동을 확인하고, 질문 5개에 답하면 나에게 맞는 감각을 찾아 드려요. 1~2분이면 끝나요.</div>' +
          '<button class="big primary" id="btnStart">시작하기</button>';
        $("btnStart").onclick = () => startReady("ask");
      } else {
        body.innerHTML =
          '<div class="tip">🔔 무음·방해 금지를 끄고 볼륨을 올려 주세요.</div>' +
          '<button class="big primary" id="btnMeet">🎨 작품 만나기</button>' +
          '<div class="card"><b>내 감각</b>: ' + mainSenses(profile) + "<br>" + summaryHTML(profile) + "</div>" +
          '<button class="big ghost" id="btnMySense">⚙️ 내 감각 바꾸기</button>' +
          '<button class="big ghost" id="btnReady">🔔 소리·진동 다시 확인</button>' +
          '<button class="big ghost" id="btnGallery">📚 내 갤러리</button>' +
          (storageOK ? "" : '<div class="note">⚠️ 이 브라우저에서는 설정이 저장되지 않아요 (시크릿 모드 등).</div>');
        $("btnMeet").onclick = () => { if (!check) startReady("camera"); else go("camera"); };
        $("btnMySense").onclick = () => { draft = copy(profile); openDetail(); };
        $("btnReady").onclick = () => startReady("home");
        $("btnGallery").onclick = () => showSoon("📚 내 갤러리", "<p>감상한 작품 기록은 <b>나중 단계</b>에서 만들어요.</p>");
      }
    }

    function showSoon(title, html) {
      $("soonTitle").textContent = title;
      $("soonBody").innerHTML = html;
      go("soon");
    }
    $("btnSoonHome").onclick = () => { renderHome(); go("home"); };
    $("btnCamHome").onclick = () => { renderHome(); go("home"); };

    // 시작!
    renderBanner();
    renderHome();
    go("home");
  </script>
</body>
</html>
